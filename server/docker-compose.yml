# Local development only. Production uses docker-compose.production.yml.
services:
  server:
    build:
      context: .
      target: build
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://user:password@db:5432/foursquare?schema=public
    command: sh -c "npm run db:migrate:deploy && npm run dev"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: foursquare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d foursquare"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
